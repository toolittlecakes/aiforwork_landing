name: Deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build public artifact
        run: bash scripts/build-pages.sh

      - name: Deploy to Yandex Object Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YANDEX_STORAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YANDEX_STORAGE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          sync_bucket() {
            local bucket="$1"

            # Порядок важен: сначала новые скрипты, потом HTML, который на них
            # ссылается, и только в конце удаление — иначе на несколько секунд
            # живая страница ссылается на ещё не загруженные файлы.

            # Скрипты: имя содержит хеш содержимого, его проставляет
            # scripts/build-pages.sh, поэтому файл неизменяем.
            aws s3 sync _site "s3://$bucket" \
              --region ru-central1 \
              --endpoint-url https://storage.yandexcloud.net \
              --exclude "*" --include "assets/*.js" --include "assets/vendor/*" \
              --cache-control "public, max-age=31536000, immutable"

            # Видео: имя содержит хеш содержимого, файл неизменяем.
            aws s3 sync _site/assets/intro "s3://$bucket/assets/intro" \
              --region ru-central1 \
              --endpoint-url https://storage.yandexcloud.net \
              --cache-control "public, max-age=31536000, immutable" \
              --delete

            # HTML: короткий TTL, чтобы деплой был виден сразу после пуша.
            aws s3 sync _site "s3://$bucket" \
              --region ru-central1 \
              --endpoint-url https://storage.yandexcloud.net \
              --exclude "*" --include "*.html" \
              --cache-control "public, max-age=60, must-revalidate"

            # Остальное (картинки, PDF, шрифты) + удаление устаревших файлов.
            # Сутки, без immutable: имена файлов не хешированы, их меняют на месте.
            aws s3 sync _site "s3://$bucket" \
              --region ru-central1 \
              --endpoint-url https://storage.yandexcloud.net \
              --exclude "assets/intro/*" \
              --cache-control "public, max-age=86400" \
              --delete
          }

          sync_bucket aiforwork.courses
          sync_bucket www.aiforwork.courses

      - name: Verify deployed pages
        run: |
          curl --fail --silent --show-error https://website.yandexcloud.net/aiforwork.courses/ >/dev/null
          curl --fail --silent --show-error https://website.yandexcloud.net/www.aiforwork.courses/ >/dev/null
          curl --fail --silent --show-error https://website.yandexcloud.net/aiforwork.courses/webinar/presentation/ >/dev/null
          curl --fail --silent --show-error https://website.yandexcloud.net/aiforwork.courses/aivolution/ >/dev/null

          # Link preview and cache policy must be live, not just committed.
          base=https://website.yandexcloud.net/aiforwork.courses
          curl --fail --silent --show-error "$base/" | grep --quiet 'property="og:image"'
          curl --silent --show-error --head "$base/" | grep --ignore-case --quiet 'cache-control: public, max-age=60'
          curl --silent --show-error --head "$base/images/og-cover.jpg" | grep --ignore-case --quiet 'cache-control: public, max-age=86400'

          # Script names are content-hashed by the build: the live page must point
          # at an existing immutable file, not at a bare /assets/*.js.
          script_path=$(curl --fail --silent --show-error "$base/" | grep --only-matching --extended-regexp '/assets/payment-request\.[0-9a-f]{12}\.js' | head -1)
          test -n "$script_path"
          curl --fail --silent --show-error --head "$base$script_path" | grep --ignore-case --quiet 'cache-control: public, max-age=31536000, immutable'
