services:
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v1.1.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:5080:5080"
    env_file: .env
    environment:
      RUST_LOG: warn
      ZO_DATA_DIR: /data
      ZO_LOCAL_MODE: "true"
      ZO_TELEMETRY: "false"
      ZO_COMPACT_DATA_RETENTION_DAYS: "7"
      ZO_MEM_TABLE_MAX_SIZE: "32"
      ZO_MAX_FILE_SIZE_IN_MEMORY: "16"
      ZO_MAX_FILE_SIZE_ON_DISK: "16"
      ZO_MEMORY_CACHE_ENABLED: "false"
      ZO_MEMORY_CACHE_DATAFUSION_MAX_SIZE: "128"
      ZO_DISK_CACHE_ENABLED: "false"
      ZO_HTTP_WORKER_NUM: "2"
      ZO_QUERY_THREAD_NUM: "2"
      ZO_QUERY_TIMEOUT: "20"
    volumes:
      - ./data:/data
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 0.5
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
